<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#0b0e15" media="(prefers-color-scheme: dark)">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

</head><body>
<title>Term Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a pocket planner. Big date + finals ring up top, an "Up next" stack, then days down a left date rail. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --raise:#ffffff; --sunk:#e8ecf2; --fg:#121826; --muted:#5b6478; --faint:#8b93a5; --line:#dfe3eb;
  --accent:#0b7d74; --accent-fg:#ffffff; --hot:#e04e39;
  --c-bio:#0b8f84; --c-phy:#3c5bd6; --c-lab:#8a4fd1; --c-he:#2e9a48; --c-ta:#d0811a; --c-hosp:#d64545; --c-mcat:#55627a; --c-me:#c4407f;
  --shadow:0 1px 2px rgb(18 24 38/.06),0 6px 18px rgb(18 24 38/.06);
  --display:"Bricolage Grotesque","Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0e15; --surface:#141924; --raise:#1a2030; --sunk:#1c2231; --fg:#eef1f7; --muted:#a3abbd; --faint:#727b8f; --line:#262e3f;
  --accent:#4fd1c2; --accent-fg:#06201d; --hot:#ff7a63;
  --c-bio:#3fd0c1; --c-phy:#8ea2ff; --c-lab:#c39bff; --c-he:#6cd98a; --c-ta:#ffb44f; --c-hosp:#ff7b7b; --c-mcat:#aab6cc; --c-me:#ff8cc0;
  --shadow:0 1px 2px rgb(0 0 0/.4),0 8px 22px rgb(0 0 0/.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0e15; --surface:#141924; --raise:#1a2030; --sunk:#1c2231; --fg:#eef1f7; --muted:#a3abbd; --faint:#727b8f; --line:#262e3f;
  --accent:#4fd1c2; --accent-fg:#06201d; --hot:#ff7a63;
  --c-bio:#3fd0c1; --c-phy:#8ea2ff; --c-lab:#c39bff; --c-he:#6cd98a; --c-ta:#ffb44f; --c-hosp:#ff7b7b; --c-mcat:#aab6cc; --c-me:#ff8cc0;
  --shadow:0 1px 2px rgb(0 0 0/.4),0 8px 22px rgb(0 0 0/.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1080px;margin:0 auto}

/* Top */
.top{padding-block:22px 6px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:16px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,52px);line-height:.95;margin:4px 0 2px;letter-spacing:-.02em}
.date{font-size:15px;color:var(--muted)}
.ring{position:relative;width:86px;height:86px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-family:var(--display);font-size:24px;font-weight:800;display:block}
.ring span{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* Sticky controls */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);padding-block:10px;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;padding:8px 10px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--raise);color:var(--fg);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:10px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:color-mix(in srgb,var(--k) 13%,var(--surface));color:var(--fg);border-radius:99px;padding:5px 12px 5px 8px;font-weight:500;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--k)}
.chip[aria-pressed=false]{background:transparent;border-color:var(--line);color:var(--faint)}
.chip[aria-pressed=false] i{background:transparent;outline:1.5px solid var(--faint)}
.chip.tog{--k:var(--muted)}

main{padding-block:18px 110px}
.stack{display:flex;flex-direction:column;gap:22px}

/* Up next */
.next{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.next{grid-template-columns:minmax(0,1fr)}}
.hero{border-radius:20px;padding:18px;background:linear-gradient(150deg,color-mix(in srgb,var(--k) 22%,var(--surface)),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--k) 30%,var(--line));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer;text-align:left}
.hero .when{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--k)}
.hero h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:14px}
.hero .count{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--k);font-variant-numeric:tabular-nums}
.hero .count small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:8px;min-width:0}
.mini h3,.sect{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px}
.pill b{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.pill.warn{border-color:color-mix(in srgb,var(--hot) 45%,var(--line));color:var(--hot)}

/* Day rail */
.day{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start}
.dl{position:sticky;top:calc(env(safe-area-inset-top,0px) + 118px);display:flex;flex-direction:column;align-items:center;gap:1px;padding-top:4px}
.dl small{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dl b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.05;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.day.is-today .dl b{background:var(--accent);color:var(--accent-fg)}
.day.is-today .dl small{color:var(--accent)}
.items{display:flex;flex-direction:column;gap:7px;min-width:0}
.dnote{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:2px 2px 0}
.dnote::before{content:"";width:14px;height:1.5px;background:var(--faint)}

.item{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:11px;border-radius:14px;padding:10px 12px 10px 10px;cursor:pointer;text-align:left;width:100%;border:1px solid color-mix(in srgb,var(--k) 18%,var(--line));background:color-mix(in srgb,var(--k) 7%,var(--surface))}
.badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 11.5px var(--display);letter-spacing:.02em;background:var(--k);color:var(--surface)}
.n{min-width:0;display:flex;flex-direction:column;gap:1px}
.n .ti{font-weight:600;font-size:14.5px;line-height:1.3}
.n .su{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n .tm{font-size:12px;color:var(--k);font-weight:600;font-variant-numeric:tabular-nums}
.r{display:flex;align-items:center;gap:8px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap}
.tag.exam{background:color-mix(in srgb,var(--hot) 16%,transparent);color:var(--hot)}
.tag.tent{background:var(--sunk);color:var(--muted)}
.tag.chk{background:color-mix(in srgb,var(--hot) 16%,transparent);color:var(--hot)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--k) 55%,var(--line));display:grid;place-items:center;flex:0 0 auto;background:var(--surface);font-size:13px;font-weight:700;color:var(--accent-fg)}
.item.block{background:transparent;border-style:dashed}
.item.block .badge{background:color-mix(in srgb,var(--k) 18%,var(--surface));color:var(--k)}
.item.block .ti{font-weight:500}
.item.exam{border:1.5px solid color-mix(in srgb,var(--hot) 55%,var(--line));background:color-mix(in srgb,var(--hot) 7%,var(--surface))}
.item.done{opacity:.55}
.item.done .ti{text-decoration:line-through}
.item.done .ck{background:var(--accent);border-color:var(--accent)}
.empty{color:var(--faint);font-size:13.5px;padding:8px 2px}
:is(.item,.chip,.seg button,.btn,.mc,.hero,input):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover){.item:hover{border-color:color-mix(in srgb,var(--k) 45%,var(--line))}}

/* Week + month */
.navrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.navrow h2{font-family:var(--display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:13px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:900px){.week{grid-template-columns:minmax(0,1fr);gap:16px}}
.wcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.wh{display:flex;align-items:baseline;gap:6px;font-family:var(--display);font-weight:700;font-size:16px;padding:2px 2px 4px;border-bottom:2px solid var(--line)}
.wh small{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wh.is-today{border-color:var(--accent);color:var(--accent)}
@media (min-width:901px){.wcol .item{grid-template-columns:minmax(0,1fr);padding:8px}.wcol .badge,.wcol .r{display:none}}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mh{font-size:10.5px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:.1em;text-transform:uppercase}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:62px;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;min-width:0}
.mc.out{opacity:.35}
.mc.sel{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
.mc .dn{font:700 13.5px var(--display);font-variant-numeric:tabular-nums}
.mc.is-today .dn{color:var(--accent-fg);background:var(--accent);border-radius:99px;width:24px;height:24px;display:grid;place-items:center}
.mc.has-exam{background:color-mix(in srgb,var(--hot) 9%,var(--surface))}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--k)}

/* Sheets */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:16px;padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.scrim{position:fixed;inset:0;background:rgb(6 9 16/.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--raise);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.sheet::before{content:"";width:38px;height:4px;border-radius:2px;background:var(--line);align-self:center;margin-top:-8px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px}.sheet::before{display:none}}
.sheet h3{font-family:var(--display);font-size:22px;font-weight:700;margin:0;line-height:1.15}
.sheet .kicker{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--k)}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:14px;margin:0}
.meta dt{color:var(--muted)} .meta dd{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:5px}
input{font:inherit;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{font-size:12.5px;color:var(--faint);display:flex;flex-direction:column;gap:6px;max-width:68ch;padding-top:8px}
.sync{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sd,var(--faint))}
@media (prefers-reduced-motion:no-preference){.item,.chip,.mc{transition:border-color .15s,background .15s,opacity .15s}}

/* Motion + gestures */
.seg{position:relative}
.seg .ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:9px;background:var(--raise);box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.seg button{position:relative;z-index:1}
.seg button[aria-pressed=true]{background:transparent;box-shadow:none}
.swrap{position:relative;border-radius:14px;overflow:hidden;background:var(--accent);touch-action:pan-y}
.swrap::before{content:"✓  Done";position:absolute;inset:0;display:flex;align-items:center;padding-left:18px;font:700 14px var(--body);color:var(--accent-fg);letter-spacing:.02em}
.swrap.undo{background:var(--muted)}
.swrap.undo::before{content:"↺  Not done"}
.swrap .item{position:relative;background:var(--surface);background-image:linear-gradient(color-mix(in srgb,var(--k) 7%,transparent),color-mix(in srgb,var(--k) 7%,transparent))}
.swrap .item.exam{background-image:linear-gradient(color-mix(in srgb,var(--hot) 7%,transparent),color-mix(in srgb,var(--hot) 7%,transparent))}
.swrap .item.dragging{transition:none}
.swrap .item.snap{transition:transform .28s cubic-bezier(.3,1.2,.5,1)}
.progress{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.progress .pt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.progress .pt b{color:var(--fg);font-family:var(--display);font-size:15px}
.track{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--c-phy)));transition:width .6s cubic-bezier(.3,1,.4,1)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.toast button{flex:0 0 auto;border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:700;border-radius:9px;padding:6px 12px;cursor:pointer}
.hint{font-size:12px;color:var(--faint);text-align:center}
@media (prefers-reduced-motion:no-preference){
  .anim > *{animation:rise .42s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(min(var(--i,0),10) * 35ms)}
  @keyframes rise{from{opacity:.001;transform:translateY(10px)}}
  .ck.pop{animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  .toast{animation:tin .3s cubic-bezier(.3,1.3,.5,1)}
  @keyframes tin{from{transform:translate(-50%,20px);opacity:.001}}
  .hero{transition:transform .2s}
  .hero:active,.item:active{transform:scale(.985)}
}
</style>

<div class="gut top"><div class="inner toprow">
  <div><div class="eyebrow">Fall term · week <span id="wkNo"></span></div><h1 id="dow"></h1><div class="date" id="dateLbl"></div></div>
  <div class="ring" id="ring" aria-label="Days until finals"></div>
</div></div>
<div class="bar gut"><div class="inner">
  <div class="seg" role="group" aria-label="View"><span class="ind" id="ind"></span><button id="v-agenda" aria-pressed="true">Agenda</button><button id="v-week" aria-pressed="false">Week</button><button id="v-month" aria-pressed="false">Month</button></div>
  <div class="chips" id="chips"></div>
</div></div>
<main class="gut"><div class="inner stack" id="main"></div></main>
<button class="btn pri fab" id="addBtn">+ Add</button>
<div id="modal"></div><div id="toastBox"></div>

<script>

const CATS={
  bio:{n:"Biochem (CH 451)",k:"--c-bio"}, phy:{n:"Physics (PH 201)",k:"--c-phy"}, lab:{n:"Physics lab (PH 224)",k:"--c-lab"},
  he:{n:"HE 250",k:"--c-he"}, ta:{n:"TA · Gen Chem lab",k:"--c-ta"}, hosp:{n:"Hospital shift",k:"--c-hosp"},
  mcat:{n:"MCAT & apps",k:"--c-mcat"}, me:{n:"My events",k:"--c-me"}};
const D=(y,m,d,h=null,mi=0)=>h==null?{y,m,d}:{y,m,d,h,mi};
// kind: due (checkable), exam (checkable, emphasised), block (class/shift/time block), note
const E=[];
const add=(id,cat,kind,date,title,o={})=>E.push({id,cat,kind,date,title,...o});

// ---- Deadlines pulled from Moodle (Nov 11, 2026) and course schedules ----
add("ph224-pre7","lab","due",D(2026,11,12,16,30),"Prelab 7",{src:"Moodle"});
add("ph224-ho6","lab","due",D(2026,11,12,23,59),"Lab Handout 6",{src:"Moodle",sub:"Group submission"});
add("ph224-lr6","lab","due",D(2026,11,12,23,59),"Lab Report 6",{src:"Moodle",sub:"Group submission"});
add("ph201-rj4","phy","due",D(2026,11,12,23,59),"Reflective Journal #4",{src:"Moodle",sub:"3+ sentences: physics in your life & career"});
add("bio-q4","bio","exam",D(2026,11,13),"Quiz 4 · Enzymes (Topic 4)",{src:"CH 451 calendar",sub:"Taken outside class on the day assigned; closed-note"});
add("bio-ps4","bio","due",D(2026,11,13),"Topic 4 practice questions",{src:"CH 451 syllabus",sub:"Submit on quiz day"});
add("bio-lit1","bio","due",D(2026,11,13),"Lit review: Kato et al. metalloenzyme",{src:"Lit review handout",sub:"Due with Topic 4 problem set"});
add("ph201-mt1fix","phy","due",D(2026,11,13,23,59),"Midterm 1 corrections (make-up points)",{src:"Moodle",sub:"Redo missed questions + explain mistakes"});
add("ph201-hw8","phy","due",D(2026,11,16,23,59),"Homework (next set)",{src:"Course schedule",tent:1,sub:"Date per schedule; confirm on Moodle"});
add("ph224-ho7","lab","due",D(2026,11,18,23,59),"Lab Handout 7",{src:"Moodle"});
add("ph224-lr7","lab","due",D(2026,11,18,23,59),"Lab Report 7",{src:"Moodle"});

function dayBlock(t,k,items){

function week(){

(async()=>{
  try{
    const db=await window.claude?.use?.("db"), user=await window.claude?.use?.("user");
    const uid=user?await user.id():null; if(!db||!uid)return;
    ref=db.doc("data/users/"+uid+"/planner");
    let first=true; const timer=setTimeout(()=>{syncMsg="Sync not reachable yet. Changes stay on this device";paint()},10000);
    ref.onSnapshot(snap=>{
      if(!snap.metadata.fromCache)clearTimeout(timer);
      if(snap.exists){const d=snap.data();ST={done:{...(d.done||{})},custom:[...(d.custom||[])]};try{localStorage.setItem("tp-state",JSON.stringify(ST))}catch(e){}}
      else if(first&&(Object.keys(ST.done).length||ST.custom.length))save();
      first=false; syncMsg="Synced across your devices"; syncOk=true; paint();
    },()=>{clearTimeout(timer);syncMsg="Sync unavailable. Changes stay on this device";syncOk=false;ref=null;paint()});
  }catch(e){}
})();
