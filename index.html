<style>
/* ---------- shell: top tab bar ---------- */
:root{--tabh:calc(env(safe-area-inset-top,0px) + 58px)}

[hidden]{display:none!important}
img{max-width:100%}
.tabs{position:fixed;inset:0 0 auto;z-index:50;height:var(--tabh);padding:calc(env(safe-area-inset-top,0px) + 8px) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));
  background:rgb(0 0 0/.82);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid #1f1f27}

  background:linear-gradient(135deg,#2563eb,#60a5fa);box-shadow:0 0 18px rgb(59 130 246/.4);transition:transform .35s cubic-bezier(.3,1.25,.5,1),background .35s,box-shadow .35s}

.tabs button{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:0;background:none;color:#9b9ba8;
  font:600 14.5px "Inter",system-ui,-apple-system,sans-serif;cursor:pointer;border-radius:10px;transition:color .25s}
.tabs button[aria-selected=true]{color:#fff}

.tabs .badge{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#ff5c6c;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

.cal{--bg:#f3f5f8; --surface:#ffffff; --raise:#ffffff; --sunk:#e8ecf2; --fg:#121826; --muted:#5b6478; --faint:#8b93a5; --line:#dfe3eb;

  --c-bio:#3fd0c1; --c-phy:#8ea2ff; --c-lab:#c39bff; --c-he:#6cd98a; --c-ta:#ffb44f; --c-hosp:#ff7b7b; --c-mcat:#aab6cc; --c-me:#ff8cc0;
  --shadow:0 1px 2px rgb(0 0 0/.4),0 8px 22px rgb(0 0 0/.35); color-scheme:dark}}

  --accent:#4fd1c2; --accent-fg:#06201d; --hot:#ff7a63;
  --c-bio:#3fd0c1; --c-phy:#8ea2ff; --c-lab:#c39bff; --c-he:#6cd98a; --c-ta:#ffb44f; --c-hosp:#ff7b7b; --c-mcat:#aab6cc; --c-me:#ff8cc0;
  --shadow:0 1px 2px rgb(0 0 0/.4),0 8px 22px rgb(0 0 0/.35); color-scheme:dark}

.cal .hero{border-radius:20px;padding:18px;background:linear-gradient(150deg,color-mix(in srgb,var(--k) 22%,var(--surface)),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--k) 30%,var(--line));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer;text-align:left}

.cal .n{min-width:0;display:flex;flex-direction:column;gap:1px}

.cal .tag.exam{background:color-mix(in srgb,var(--hot) 16%,transparent);color:var(--hot)}

.cal .ck{width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--k) 55%,var(--line));display:grid;place-items:center;flex:0 0 auto;background:var(--surface);font-size:13px;font-weight:700;color:var(--accent-fg)}

.cal .wcol{display:flex;flex-direction:column;gap:6px;min-width:0}

.cal .fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:16px;padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.cal .scrim{position:fixed;inset:0;background:rgb(6 9 16/.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}

@media (prefers-reduced-motion:no-preference){.cal .item,.cal .chip,.cal .mc{transition:border-color .15s,background .15s,opacity .15s}}
.cal .seg{position:relative}

/* ---------- to-do ---------- */
.todo{--bg:#000; --card:rgb(14 14 19/.72); --card-done:rgb(8 8 10/.62); --line:#1f1f27; --fg:#f5f5f7; --muted:#9b9ba8; --faint:#5d5d6a;
  --hot:#ff5c6c; --good:#22c55e;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,sans-serif;
  --c:#3b82f6;
  color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.todo,.todo{margin:0;background:var(--bg);color:var(--fg)}
.todo{font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
.todo .bg{position:fixed;inset:-25%;z-index:0;pointer-events:none;overflow:hidden;
  transform:translate3d(var(--px,0px),var(--py,0px),0);transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.todo .orbit{position:absolute;left:var(--x);top:var(--y);width:0;height:0;animation:tspin var(--t) linear infinite;will-change:transform}
.todo .orbit.rev{animation-direction:reverse}
.todo .orb{position:absolute;width:var(--s);height:var(--s);left:calc(var(--r) - var(--s)/2);top:calc(var(--s)/-2);border-radius:50%;
  background:radial-gradient(circle closest-side,var(--col),transparent);animation:tbreathe var(--b,10s) ease-in-out infinite alternate}
@keyframes tspin{to{transform:rotate(360deg)}}
@keyframes tbreathe{from{transform:scale(.85);opacity:.75}to{transform:scale(1.15);opacity:1}}
.todo .stars{position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 72% 9%,#fff7,transparent),radial-gradient(1.5px 1.5px at 38% 42%,#fff6,transparent),
   radial-gradient(1px 1px at 86% 55%,#fff7,transparent),radial-gradient(1px 1px at 22% 74%,#fff5,transparent),radial-gradient(1.5px 1.5px at 61% 83%,#fff6,transparent),
   radial-gradient(1px 1px at 48% 12%,#fff5,transparent),radial-gradient(1px 1px at 93% 31%,#fff6,transparent),radial-gradient(1px 1px at 6% 47%,#fff5,transparent);
  animation:ttwinkle 7s ease-in-out infinite alternate,tspin 240s linear infinite;transform-origin:50% 40%}
@keyframes ttwinkle{from{opacity:.25}to{opacity:.6}}
@media (prefers-reduced-motion:reduce){.todo .orbit,.todo .orb,.todo .stars{animation:none}
.todo .bg{transition:none}}
.todo button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.todo main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:calc(var(--tabh) + 18px) 16px 200px}
.todo .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:0 4px}
.todo .date{margin:0 0 2px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.todo h1{margin:0;font-family:var(--display);font-weight:800;font-size:46px;line-height:1;letter-spacing:-.02em;
  background:linear-gradient(100deg,#fff 10%,#93c5fd 45%,#7dd3fc 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.todo .sub{margin:8px 0 0;color:var(--muted);font-size:14px}
.todo .sub b{color:var(--fg);font-weight:600}
.todo .ring{position:relative;width:66px;height:66px;flex:none}
.todo .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.todo .ring .trk{stroke:#1c1c24}
.todo .ring .val{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.todo .ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px}
.todo .filters{display:flex;gap:8px;overflow-x:auto;margin:20px -16px 6px;padding:2px 16px 6px;scrollbar-width:none}
.todo .filters::-webkit-scrollbar,.todo .opts::-webkit-scrollbar{display:none}
.todo .chip{flex:none;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#0b0b0f;color:var(--muted);font-size:13.5px;font-weight:600;transition:.2s}
.todo .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.todo .chip .n{font-size:12px;color:var(--faint);font-weight:600}
.todo .chip.on{color:#fff;border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,#000);box-shadow:0 0 18px color-mix(in srgb,var(--c) 22%,transparent)}
.todo .chip.on .n{color:color-mix(in srgb,var(--c) 70%,#fff)}
.todo .grp{margin-top:22px}
.todo .gh{display:flex;align-items:center;gap:8px;margin:0 4px 10px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.todo .gh .cnt{color:var(--faint)}
.todo .gh.hot{color:var(--hot)}
.todo .gh .clear{margin-left:auto;font-size:12px;letter-spacing:.04em;color:var(--faint);padding:4px 8px;border-radius:8px;border:1px solid var(--line)}
.todo .row{position:relative;margin-bottom:10px;border-radius:18px;overflow:hidden;transition:height .25s ease,margin .25s ease,opacity .25s ease}
.todo .row.new{animation:tpop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes tpop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.todo .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:700;font-size:14px;color:#fff;opacity:0}
.todo .under span{display:flex;align-items:center;gap:8px;transition:transform .15s}
.todo .under svg{width:18px;height:18px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.todo .row.swiping .under{opacity:1}
.todo .row.go-r .under{background:linear-gradient(90deg,#15803d,#22c55e)}
.todo .row.go-l .under{background:linear-gradient(270deg,#be123c,#f43f5e)}
.todo .row.go-r .u-r,.todo .row.go-l .u-l{visibility:hidden}
.todo .row.armed .under span{transform:scale(1.15)}
.todo .item{position:relative;display:flex;gap:14px;align-items:flex-start;padding:15px 16px 15px 17px;background:var(--card);border:1px solid var(--line);border-radius:18px;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),background .25s,border-color .25s}
.todo .item::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:0 3px 3px 0;background:var(--c);box-shadow:0 0 12px var(--c);transition:opacity .3s}
.todo .item:active{background:rgb(24 24 32/.8)}
.todo .chk{flex:none;width:24px;height:24px;margin-top:-1px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;transition:background .25s,box-shadow .25s}
.todo .chk svg{width:14px;height:14px;stroke:#000;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s .08s}
.todo .body{min-width:0;flex:1}
.todo .txt{font-size:16px;font-weight:500;word-break:break-word;
  background:linear-gradient(var(--c),var(--c)) no-repeat 0 56%/0% 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  transition:background-size .4s ease,color .35s}
.todo .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.todo .tag{color:var(--c);font-weight:600}
.todo .due{display:flex;align-items:center;gap:4px}
.todo .due.late{color:var(--hot);font-weight:600}
.todo .due.today{color:#fde047;font-weight:600}
.todo .is-done .item{background:var(--card-done);border-color:#15151b}
.todo .is-done .item::before{opacity:.35}
.todo .is-done .chk{background:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent)}
.todo .is-done .chk svg{stroke-dashoffset:0}
.todo .is-done .txt{background-size:100% 2px;color:var(--faint)}
.todo .is-done .meta{opacity:.55}
.todo .empty{text-align:center;padding:60px 20px 20px;color:var(--muted)}
.todo .empty .big{font-family:var(--display);font-weight:800;font-size:24px;color:var(--fg);margin-bottom:6px}
.todo .empty .orb{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:conic-gradient(from 200deg,#2563eb,#60a5fa,#93c5fd,#2563eb);filter:blur(.3px);box-shadow:0 0 40px rgb(59 130 246/.35);display:grid;place-items:center}
.todo .empty .orb::after{content:"";width:70px;height:70px;border-radius:50%;background:#000}
.todo .hint{text-align:center;color:var(--faint);font-size:12px;margin-top:26px;line-height:1.7}
.todo .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:26px 0 calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom,transparent,#07080b 34%)}
.todo .dock-in{max-width:640px;margin:0 auto;padding:0 16px}
.todo .opts{display:flex;gap:7px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px;scrollbar-width:none}
.todo .opt{position:relative;flex:none;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#0b0b0f;color:var(--muted);font-size:13px;font-weight:600}
.todo .opt .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.todo .opt.on{color:#fff;border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,#000)}
.todo .opt.dt{--c:#fde047}
.todo .opt input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;-webkit-appearance:none}
.todo .sep{flex:none;width:1px;margin:5px 3px;background:var(--line)}
.todo .bar{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 18px;border-radius:22px;background:#0f0f14;border:1px solid #2a2a34;
  box-shadow:0 14px 40px rgb(0 0 0/.7);transition:border-color .2s,box-shadow .2s}
.todo .bar:focus-within{border-color:color-mix(in srgb,var(--c) 75%,transparent);box-shadow:0 0 28px color-mix(in srgb,var(--c) 28%,transparent),0 14px 40px rgb(0 0 0/.7)}
.todo .bar input{flex:1;min-width:0;padding:11px 0;border:0;outline:0;background:none;color:var(--fg);font:500 16px var(--body)}
.todo .bar input::placeholder{color:var(--faint)}
.todo .add{flex:none;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(135deg,#2563eb,#3b82f6 55%,#60a5fa);box-shadow:0 0 22px rgb(59 130 246/.45);transition:transform .15s}
.todo .add:active{transform:scale(.92)}
.todo .add svg{width:22px;height:22px;stroke:#fff;stroke-width:2.8;stroke-linecap:round}
.todo .scrim{position:fixed;inset:0;z-index:40;background:rgb(0 0 0/.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.todo .scrim.open{opacity:1;pointer-events:auto}
.todo .sheet{width:100%;max-width:640px;background:#0d0d12;border:1px solid #24242d;border-bottom:0;border-radius:26px 26px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.todo .scrim.open .sheet{transform:none}
.todo .grab{width:40px;height:5px;border-radius:3px;background:#2c2c36;margin:0 auto 14px}
.todo .sheet h2{margin:0 0 12px;font-family:var(--display);font-size:20px}
.todo .sheet textarea{width:100%;min-height:70px;resize:none;padding:13px 14px;border-radius:14px;border:1px solid #2a2a34;background:#000;color:var(--fg);font:500 16px var(--body);outline:0}
.todo .sheet textarea:focus{border-color:var(--c)}
.todo .lbl{margin:16px 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.todo .wrap{display:flex;flex-wrap:wrap;gap:7px}
.todo .acts{display:flex;gap:10px;margin-top:22px}
.todo .btn{flex:1;padding:14px;border-radius:14px;font-weight:700;font-size:15px}
.todo .btn.del{flex:none;padding:14px 18px;color:#ff7b88;background:rgb(244 63 94/.12);border:1px solid rgb(244 63 94/.3)}
.todo .btn.save{color:#fff;background:linear-gradient(135deg,#2563eb,#3b82f6 55%,#60a5fa)}
.todo .rep{display:flex;align-items:center;gap:4px;color:#93c5fd;font-weight:500}
.todo .streak{color:#fdba74;font-weight:700}
.todo .gh.daily{color:#93c5fd}
.todo .gh svg{width:13px;height:13px}
.todo .row.off{opacity:.42}
.todo .row.off .chk{border-style:dashed}
.todo .opt.rp{--c:#60a5fa}
.todo .opt.rp svg{flex:none}
.todo .days{margin-top:8px}
.todo .opt.day{width:38px;height:38px;padding:0;justify-content:center;--c:#60a5fa}
.todo .toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:16px;padding:11px 12px 11px 18px;border-radius:14px;background:#1a1a22;border:1px solid #2c2c37;box-shadow:0 10px 30px rgb(0 0 0/.6);font-size:14px;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.25s}
.todo .toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.todo .toast button{color:#93c5fd;font-weight:700;padding:4px 8px}
.todo .imp{margin-top:10px;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px}

/* ---------- money ---------- */
.money{--card:rgb(17 20 27/.78);--line:#222733;--fg:#f2f4f8;--muted:#9aa3b5;--faint:#667085;--blue:#3b82f6;--blue2:#60a5fa;--hot:#ff6b6b;--good:#34d399;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Inter",system-ui,-apple-system,sans-serif;
  color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;color-scheme:dark;min-height:100vh}
.money *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.money button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.money main{position:relative;max-width:640px;margin:0 auto;padding:calc(var(--tabh) + 18px) 16px 130px}
.money .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 4px}
.money .mnav{display:flex;align-items:center;gap:6px;margin:0 0 2px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.money .mnav button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);color:var(--muted);font-size:15px;line-height:1}
.money h1{margin:0;font-family:var(--display);font-weight:800;font-size:46px;line-height:1;letter-spacing:-.02em;background:linear-gradient(100deg,#fff 10%,#93c5fd 55%,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.money .pbtn{padding:9px 14px;border-radius:12px;border:1px solid #2a3040;background:#0f1218;color:var(--blue2);font-weight:700;font-size:13.5px}
.money .card{margin-top:14px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.money .lbl{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.money .hero{position:relative;overflow:hidden;border-color:#27406e;background:linear-gradient(150deg,rgb(37 99 235/.22),rgb(17 20 27/.8) 65%)}
.money .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle closest-side,rgb(96 165 250/.35),transparent);animation:mglow 4.5s ease-in-out infinite alternate;pointer-events:none}
@keyframes mglow{from{transform:scale(.8);opacity:.5}to{transform:scale(1.2);opacity:1}}
.money .big{font-family:var(--display);font-weight:800;font-size:52px;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0 2px}
.money .big.neg{color:var(--hot)}
.money .hsub{color:var(--muted);font-size:13.5px}
.money .track{position:relative;height:10px;border-radius:99px;background:#1a1f2b;margin-top:14px}
.money .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2563eb,#60a5fa);box-shadow:0 0 14px rgb(59 130 246/.55);transition:width .8s cubic-bezier(.2,.9,.3,1)}
.money .track.over i{background:linear-gradient(90deg,#e5484d,#ff8b8b);box-shadow:0 0 14px rgb(255 107 107/.45)}
.money .track u{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:#fff;opacity:.85}
.money .pace{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:12.5px;color:var(--muted)}
.money .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-weight:700;font-size:12px;background:rgb(59 130 246/.16);color:var(--blue2)}
.money .pill.bad{background:rgb(255 107 107/.14);color:var(--hot)}
.money .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.money .tile{padding:13px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.money .tile b{display:block;font-family:var(--display);font-weight:800;font-size:21px;font-variant-numeric:tabular-nums;margin:4px 0 1px}
.money .tile small{font-size:11.5px;color:var(--faint)}
.money .tile .lbl{font-size:10.5px}
.money .donut{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center;margin-top:12px}
.money .dwrap{position:relative;width:150px;height:150px}
.money .dwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.money .dwrap circle{fill:none;stroke-width:13;transition:opacity .2s,stroke-width .2s;cursor:pointer}
.money .dwrap.foc circle:not(.on){opacity:.25}
.money .dwrap circle.on{stroke-width:16}
.money .dmid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.money .dmid b{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.money .dmid span{font-size:11.5px;color:var(--muted)}
.money .leg{display:flex;flex-direction:column;gap:2px;min-width:0}
.money .leg button{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;font-size:13px;text-align:left;width:100%}
.money .leg button.on{background:#1a2030}
.money .leg i{flex:none;width:9px;height:9px;border-radius:3px;background:var(--c)}
.money .leg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money .leg em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.money .cmp{margin-top:12px;display:flex;flex-direction:column;gap:13px}
.money .cr{display:grid;gap:5px}
.money .cr .t{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.money .cr .t span{display:flex;align-items:center;gap:8px;font-weight:600}
.money .cr .t i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.money .cr .t em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.money .cr .t em b{color:var(--fg)}
.money .cr.over .t em b{color:var(--hot)}
.money .cbar{height:7px;border-radius:99px;background:#1a1f2b;overflow:hidden}
.money .cbar i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .8s cubic-bezier(.2,.9,.3,1)}
.money .cr.over .cbar i{background:var(--hot)}
.money .tx{display:flex;align-items:center;gap:12px;width:100%;padding:11px 2px;border-bottom:1px solid #1a1e28;text-align:left}
.money .tx:last-child{border-bottom:0}
.money .tx i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.money .tx span{flex:1;min-width:0}
.money .tx span b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money .tx span small{color:var(--muted);font-size:12px}
.money .tx em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.money .tx em.in{color:var(--good)}
.money .empty{color:var(--muted);font-size:14px;padding:10px 0 2px}
.money .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.money .abtn{padding:14px 10px;border-radius:16px;font-weight:700;font-size:14px;border:1px solid #2a3040;background:#0f1218;color:var(--fg)}
.money .abtn.pri{border:0;color:#fff;background:linear-gradient(135deg,#2563eb,#3b82f6 55%,#60a5fa);box-shadow:0 0 22px rgb(59 130 246/.4)}
.money .abtn:active,.money .fab:active{transform:scale(.96)}
.money .nudge{display:flex;align-items:center;gap:12px;border-color:#27406e}
.money .nudge .dotp{flex:none;width:10px;height:10px;border-radius:50%;background:var(--blue2);animation:mping 1.8s ease-out infinite}
@keyframes mping{0%{box-shadow:0 0 0 0 rgb(96 165 250/.6)}100%{box-shadow:0 0 0 12px rgb(96 165 250/0)}}
.money .nudge p{margin:0;font-size:13.5px;color:var(--muted)}
.money .nudge p b{color:var(--fg);display:block}
.money .hint{text-align:center;color:var(--faint);font-size:12px;margin-top:22px;line-height:1.7}

const BADGE={bio:"BIO",phy:"PHY",lab:"LAB",he:"HE",ta:"TA",hosp:"HSP",mcat:"MCAT",me:"ME"};

// ---- State: done marks + own events (synced via db when available) ----
let ST={done:{},custom:[]}, ref=null, syncMsg="Saved on this device", syncOk=false, writing=Promise.resolve();
try{const s=JSON.parse(localStorage.getItem("tp-state")||"null");if(s)ST={done:s.done||{},custom:s.custom||[]}}catch(e){}
function save(){
  try{localStorage.setItem("tp-state",JSON.stringify(ST))}catch(e){}

}
const all=()=>E.concat(ST.custom.map(c=>({...c,cat:"me",kind:c.time?"block":"due",mine:1})));
const toDate=e=>new Date(e.date.y,e.date.m-1,e.date.d,e.date.h??0,e.date.mi??0);

const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],DOWL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];

const NOW=new Date(), TODAY=new Date(NOW);TODAY.setHours(0,0,0,0);
const visible=e=>on.has(e.cat)&&(showClasses||!e.cls);
const isTask=e=>e.kind==="due"||e.kind==="exam";

function rel(e){
  const t=toDate(e), dd=Math.round((new Date(e.date.y,e.date.m-1,e.date.d)-TODAY)/864e5);
  const tm=e.date.h==null?"":" · "+fmtT(e.date.h,e.date.mi);
  if(dd===0)return "Today"+tm; if(dd===1)return "Tomorrow"+tm; if(dd<7)return DOWL[t.getDay()]+tm;

}
function itemHTML(e){
  const done=!!ST.done[e.id], task=isTask(e);
  const tags=(e.kind==="exam"?'<span class="tag exam">Exam</span>':"")+(e.tent?'<span class="tag tent">Tentative</span>':"")+(e.chk?'<span class="tag chk">Check</span>':"");
  const html=`<button class="item ${e.kind} ${done?"done":""}" data-id="${e.id}" style="--k:var(${CATS[e.cat].k})">
    <span class="badge">${BADGE[e.cat]}</span>
    <span class="n"><span class="tm">${timeLbl(e)}</span><span class="ti">${esc(e.title)}</span><span class="su">${esc(e.sub||CATS[e.cat].n)}</span></span>
    <span class="r">${tags}${task?`<span class="ck ${popId===e.id?"pop":""}" data-chk="${e.id}" role="checkbox" aria-checked="${done}" aria-label="Mark ${esc(e.title)} done">${done?"✓":""}</span>`:""}</span>
  </button>`;
  return task?`<div class="swrap ${done?"undo":""}" data-sw="${e.id}">${html}</div>`:html;
}
const byDay=list=>{const m={};list.forEach(e=>(m[dayKey(e)]??=[]).push(e));Object.values(m).forEach(a=>a.sort((a,b)=>toDate(a)-toDate(b)));return m};

function progress(){
  const s=new Date(TODAY);s.setDate(s.getDate()-((s.getDay()+6)%7));const e=new Date(s);e.setDate(s.getDate()+7);
  const W=all().filter(x=>isTask(x)&&toDate(x)>=s&&toDate(x)<e), d=W.filter(x=>ST.done[x.id]).length, pc=W.length?Math.round(d/W.length*100):100;
  return `<div class="progress"><div class="pt"><span>This week</span><span><b>${d}</b> of ${W.length} done</span></div><div class="track"><i style="width:${pc}%"></i></div></div>`;
}
function header(){
  $("dow").textContent=DOWL[TODAY.getDay()];
  $("dateLbl").textContent=MONL[TODAY.getMonth()]+" "+TODAY.getDate()+", "+TODAY.getFullYear();
  const start=new Date(2026,8,21), wk=Math.floor((TODAY-start)/(7*864e5));
  $("wkNo").textContent=Math.max(0,Math.min(11,wk));
  const total=(new Date(2026,11,9)-new Date(2026,8,23))/864e5, left=Math.max(0,Math.round((new Date(2026,11,9)-TODAY)/864e5));
  const p=Math.min(1,1-left/total), C=2*Math.PI*36;
  $("ring").innerHTML=`<svg viewBox="0 0 86 86"><circle cx="43" cy="43" r="36" fill="none" stroke="var(--sunk)" stroke-width="7"/><circle cx="43" cy="43" r="36" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*p} ${C}"/></svg><div class="lbl"><div><b>${left}</b><span>days to<br>finals</span></div></div>`;
}
function upNext(){
  const L=all().filter(e=>isTask(e)&&!ST.done[e.id]&&toDate(e)>=TODAY).sort((a,b)=>toDate(a)-toDate(b)||(b.kind==="exam")-(a.kind==="exam"));
  const exam=L.find(e=>e.kind==="exam"), soon=L.filter(e=>e!==exam).slice(0,3);
  const wk=new Date(TODAY);wk.setDate(wk.getDate()+7);
  const due7=L.filter(e=>toDate(e)<wk).length, chk=L.filter(e=>e.chk).length;
  const dd=exam?Math.round((new Date(exam.date.y,exam.date.m-1,exam.date.d)-TODAY)/864e5):0;
  return `<section class="next">
    ${exam?`<button class="hero" data-id="${exam.id}" style="--k:var(${CATS[exam.cat].k})"><span class="when">Next exam · ${CATS[exam.cat].n}</span><h2>${esc(exam.title)}</h2><div class="count">${dd===0?"Today":dd}${dd>0?`<small>${dd===1?"day":"days"} · ${rel(exam)}</small>`:""}</div><p>${esc(exam.sub||"")}</p></button>`:""}
    <div class="mini"><h3>Coming up</h3>${soon.map(itemHTML).join("")||'<div class="empty">You\'re all caught up.</div>'}
      ${progress()}
      <div class="stats"><span class="pill"><b>${due7}</b> due this week</span>${chk?`<span class="pill warn"><b>${chk}</b> HE 250 quizzes to check</span>`:""}</div>
    </div>
  </section>`;
}
function dayBlock(t,k,items){
  return `<section class="day ${+t===+TODAY?"is-today":""}"><div class="dl"><small>${+t===+TODAY?"Today":DOW[t.getDay()]}</small><b>${t.getDate()}</b><small>${MON[t.getMonth()]}</small></div>
    <div class="items">${NOTES[k]?`<div class="dnote">${NOTES[k]}</div>`:""}${items.map(itemHTML).join("")||'<div class="empty">Nothing scheduled</div>'}</div></section>`;
}
function agenda(){
  const m=byDay(all().filter(visible)), start=showPast?new Date(2026,10,2):TODAY, end=new Date(2026,11,13);
  let h=upNext()+'<div class="sect">Day by day</div>';
  for(let t=new Date(start);t<=end;t.setDate(t.getDate()+1)){const k=key(t),it=m[k]||[];if(!it.length&&!NOTES[k]&&+t!==+TODAY)continue;h+=dayBlock(new Date(t),k,it)}
  const later=all().filter(visible).filter(e=>toDate(e)>end&&e.cat!=="hosp").sort((a,b)=>toDate(a)-toDate(b));
  if(later.length)h+='<div class="sect">After this term</div>'+later.map(e=>dayBlock(toDate(e),dayKey(e),[e])).join("");
  h+=`<div><button class="btn" id="pastBtn">${showPast?"Hide past days":"Show earlier this month"}</button></div>`;
  return h+foot();
}
function week(){
  const s=new Date(cursor);s.setHours(0,0,0,0);s.setDate(s.getDate()-((s.getDay()+6)%7));const e6=new Date(s);e6.setDate(s.getDate()+6);
  const m=byDay(all().filter(visible));let cols="";
  for(let i=0;i<7;i++){const t=new Date(s);t.setDate(s.getDate()+i);const k=key(t);
    cols+=`<div class="wcol"><div class="wh ${+t===+TODAY?"is-today":""}">${t.getDate()}<small>${DOW[t.getDay()]}</small></div>${NOTES[k]?`<div class="dnote">${NOTES[k]}</div>`:""}${(m[k]||[]).map(itemHTML).join("")||'<div class="empty">Free</div>'}</div>`}
  return `<div class="navrow"><button class="btn" data-nav="-7" aria-label="Previous week">‹</button><h2>${MON[s.getMonth()]} ${s.getDate()} – ${MON[e6.getMonth()]} ${e6.getDate()}</h2><button class="btn" data-nav="7" aria-label="Next week">›</button></div><div class="week">${cols}</div>`+foot();
}
function month(){
  const y=cursor.getFullYear(),mo=cursor.getMonth(),first=new Date(y,mo,1),s=new Date(first);s.setDate(1-((first.getDay()+6)%7));
  const m=byDay(all().filter(visible));
  let h=`<div class="navrow"><button class="btn" data-mnav="-1" aria-label="Previous month">‹</button><h2>${MONL[mo]} ${y}</h2><button class="btn" data-mnav="1" aria-label="Next month">›</button></div><div class="month">`+["M","T","W","T","F","S","S"].map(d=>`<div class="mh">${d}</div>`).join("");
  for(let i=0;i<42;i++){const t=new Date(s);t.setDate(s.getDate()+i);const k=key(t),it=m[k]||[];
    h+=`<button class="mc ${t.getMonth()!==mo?"out":""} ${+t===+TODAY?"is-today":""} ${selDay===k?"sel":""} ${it.some(e=>e.kind==="exam")?"has-exam":""}" data-day="${k}" aria-label="${MON[t.getMonth()]} ${t.getDate()}, ${it.length} items"><span class="dn">${t.getDate()}</span><span class="dots">${it.slice(0,8).map(e=>`<i style="--k:var(${CATS[e.cat].k})"></i>`).join("")}</span></button>`}
  h+="</div>";
  if(selDay){const [Y,M,Dd]=selDay.split("-").map(Number);h+=dayBlock(new Date(Y,M-1,Dd),selDay,m[selDay]||[])}
  else h+='<div class="empty">Tap a day to see what\'s on it. Tinted days have an exam or quiz.</div>';
  return h+foot();
}
const foot=()=>`<div class="hint">${view==="agenda"?"Swipe a task right to check it off":"Swipe sideways to change "+view}</div><div class="foot"><span class="sync" style="--sd:${syncOk?"var(--accent)":"var(--faint)"}">${syncMsg}</span><span>Pulled from Moodle and your course schedules on Nov 11, 2026. Tentative items come from a schedule marked "subject to change", so confirm them on Moodle. Physics lab is shown in the 1:30 pm section because you TA during the morning one.</span></div>`;

function chips(){
  $("chips").innerHTML=Object.entries(CATS).map(([k,c])=>`<button class="chip" data-cat="${k}" aria-pressed="${on.has(k)}" style="--k:var(${c.k})"><i></i>${c.n}</button>`).join("")+`<button class="chip tog" id="clsTog" aria-pressed="${showClasses}"><i></i>Class meetings</button>`;
}
let popId=null, animNext=true;
function paint(){
  const vs=["agenda","week","month"];vs.forEach(v=>$("v-"+v).setAttribute("aria-pressed",v===view));
  $("ind").style.transform=`translateX(${vs.indexOf(view)*100}%)`;
  const m=$("main");m.innerHTML=view==="agenda"?agenda():view==="week"?week():month();
  m.classList.toggle("anim",animNext);if(animNext)[...m.children].forEach((c,i)=>c.style.setProperty("--i",i));
  animNext=false;popId=null;
}
["agenda","week","month"].forEach(v=>$("v-"+v).onclick=()=>{if(view===v)return;view=v;animNext=true;saveUi();paint()});
$("chips").onclick=ev=>{const b=ev.target.closest(".chip");if(!b)return;if(b.id==="clsTog")showClasses=!showClasses;else{const k=b.dataset.cat;on.has(k)?on.delete(k):on.add(k)}saveUi();chips();paint()};
$("main").onclick=ev=>{
  const c=ev.target.closest("[data-chk]");if(c){ev.stopPropagation();toggle(c.dataset.chk);return}
  const it=ev.target.closest("[data-id]");if(it){detail(it.dataset.id);return}
  const n=ev.target.closest("[data-nav]");if(n){cursor.setDate(cursor.getDate()+ +n.dataset.nav);paint();return}
  const mn=ev.target.closest("[data-mnav]");if(mn){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+ +mn.dataset.mnav,1);selDay=null;paint();return}
  const d=ev.target.closest("[data-day]");if(d){selDay=d.dataset.day;paint();return}
  if(ev.target.id==="pastBtn"){showPast=!showPast;animNext=true;paint()}
};
// Swipe an item right to complete; swipe the page sideways to change week or month.
let drag=null, suppress=false;
$("main").addEventListener("touchstart",ev=>{const t=ev.touches[0];const w=ev.target.closest(".swrap");drag={x:t.clientX,y:t.clientY,w,it:w&&w.querySelector(".item"),dx:0,axis:null}},{passive:true});
$("main").addEventListener("touchmove",ev=>{if(!drag)return;const t=ev.touches[0],dx=t.clientX-drag.x,dy=t.clientY-drag.y;
  if(!drag.axis&&(Math.abs(dx)>8||Math.abs(dy)>8))drag.axis=Math.abs(dx)>Math.abs(dy)?"x":"y";
  if(drag.axis==="x"&&drag.it){drag.dx=Math.max(0,Math.min(dx,180));drag.it.classList.add("dragging");drag.it.style.transform=`translateX(${drag.dx}px)`}
},{passive:true});
$("main").addEventListener("touchend",ev=>{if(!drag)return;const d=drag;drag=null;
  if(d.axis==="x"&&d.it){suppress=true;setTimeout(()=>suppress=false,350);d.it.classList.remove("dragging");d.it.classList.add("snap");
    if(d.dx>90){d.it.style.transform="translateX(110%)";setTimeout(()=>toggle(d.w.dataset.sw),180)}else d.it.style.transform="";return}
  if(d.axis==="x"&&!d.w&&view!=="agenda"){const dx=ev.changedTouches[0].clientX-d.x;if(Math.abs(dx)>60){
    if(view==="week")cursor.setDate(cursor.getDate()+(dx<0?7:-7));else{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+(dx<0?1:-1),1);selDay=null}
    animNext=true;paint()}}
});
$("main").addEventListener("click",ev=>{if(suppress){ev.stopPropagation();ev.preventDefault()}},true);
let toastT=null;
function toggle(id){
  const was=!!ST.done[id];if(was)delete ST.done[id];else ST.done[id]=true;
  popId=was?null:id;save();paint();
  const e=all().find(x=>x.id===id);clearTimeout(toastT);
  $("toastBox").innerHTML=`<div class="toast" role="status"><span>${was?"Marked not done":"Done"} · ${esc(e?e.title:"")}</span><button id="undoBtn">Undo</button></div>`;
  $("undoBtn").onclick=()=>{if(was)ST.done[id]=true;else delete ST.done[id];save();paint();$("toastBox").innerHTML=""};
  toastT=setTimeout(()=>$("toastBox").innerHTML="",3500);
}
function close(){$("modal").innerHTML=""}
function detail(id){
  const e=all().find(x=>x.id===id);if(!e)return;const t=toDate(e),task=isTask(e);
  $("modal").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(e.title)}" style="--k:var(${CATS[e.cat].k})">
    <div><div class="kicker">${CATS[e.cat].n}${e.kind==="exam"?" · Exam":""}</div><h3>${esc(e.title)}</h3></div>
    <dl class="meta"><dt>When</dt><dd>${DOWL[t.getDay()]}, ${MONL[t.getMonth()]} ${t.getDate()}${e.date.h!=null?" · "+timeLbl(e):""}</dd>${e.sub?`<dt>Details</dt><dd>${esc(e.sub)}</dd>`:""}${e.src?`<dt>Source</dt><dd>${esc(e.src)}${e.tent?" (tentative)":""}</dd>`:""}</dl>
    <div class="row">${e.mine?'<button class="btn" id="delBtn">Delete</button>':""}<button class="btn" id="closeBtn">Close</button>${task?`<button class="btn pri" id="doneBtn">${ST.done[id]?"Mark not done":"Mark done"}</button>`:""}</div>
  </div></div>`;
  $("scrim").onclick=ev=>{if(ev.target.id==="scrim")close()};$("closeBtn").onclick=close;
  if(task)$("doneBtn").onclick=()=>{toggle(id);close()};
  if(e.mine)$("delBtn").onclick=()=>{ST.custom=ST.custom.filter(c=>c.id!==id);save();close();paint()};
}
$("addBtn").onclick=()=>{
  $("modal").innerHTML=`<div class="scrim" id="scrim"><form class="sheet" id="addForm" aria-label="Add an event" style="--k:var(--c-me)">
    <div><div class="kicker">My events</div><h3>Add to your planner</h3></div>
    <label for="f-title">What<input id="f-title" required maxlength="120" placeholder="Shadowing, secondary essay, study group…"></label>
    <div class="two"><label for="f-date">Date<input id="f-date" type="date" required value="${key(TODAY)}"></label><label for="f-time">Time (optional)<input id="f-time" type="time"></label></div>
    <label for="f-sub">Note (optional)<input id="f-sub" maxlength="160"></label>
    <div class="row"><button type="button" class="btn" id="closeBtn">Cancel</button><button class="btn pri" type="submit">Add</button></div>
  </form></div>`;
  $("scrim").onclick=ev=>{if(ev.target.id==="scrim")close()};$("closeBtn").onclick=close;
  $("addForm").onsubmit=ev=>{ev.preventDefault();const [y,m,d]=$("f-date").value.split("-").map(Number),tm=$("f-time").value;
    const date=tm?D(y,m,d,+tm.split(":")[0],+tm.split(":")[1]):D(y,m,d);
    ST.custom.push({id:"me-"+Date.now().toString(36),title:$("f-title").value.trim(),sub:$("f-sub").value.trim(),date,time:!!tm,src:"Added by you"});save();close();paint()};
  setTimeout(()=>$("f-title").focus(),30);
};
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")close()});
header();chips();paint();

(async()=>{
  try{
    const db=await window.claude?.use?.("db"), user=await window.claude?.use?.("user");
    const uid=user?await user.id():null; if(!db||!uid)return;
    ref=db.doc("data/users/"+uid+"/planner");
    let first=true; const timer=setTimeout(()=>{syncMsg="Sync not reachable yet. Changes stay on this device";paint()},10000);
    ref.onSnapshot(snap=>{
      if(!snap.metadata.fromCache)clearTimeout(timer);
      if(snap.exists){const d=snap.data();ST={done:{...(d.done||{})},custom:[...(d.custom||[])]};try{localStorage.setItem("tp-state",JSON.stringify(ST))}catch(e){}}
      else if(first&&(Object.keys(ST.done).length||ST.custom.length))save();
      first=false; syncMsg="Synced across your devices"; syncOk=true; paint();
    },()=>{clearTimeout(timer);syncMsg="Sync unavailable. Changes stay on this device";syncOk=false;ref=null;paint()});
  }catch(e){}
})();

})();
</script>
<script>
/* ===== To-Do ===== */
(()=>{
const CATS=[
  {k:'school',  n:'School',  c:'#38bdf8'},
  {k:'work',    n:'Work',    c:'#fb7185'},
  {k:'personal',n:'Personal',c:'#818cf8'},
  {k:'mcat',    n:'MCAT',    c:'#facc15'},
  {k:'errands', n:'Errands', c:'#fb923c'},
  {k:'health',  n:'Health',  c:'#34d399'}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.k,c]));
const KEY='colby.todo.v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CHK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const TRASH='<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
const CAL='<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>';

/* ---------- state ---------- */
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.tasks))return s}catch(e){}return{tasks:[],cat:'personal',filter:'all'}}
let S=load();
if(!CAT[S.cat])S.cat='personal';
if(S.filter!=='all'&&!CAT[S.filter])S.filter='all';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}dispatchEvent(new Event('todo-change'))}
let addDue=null;            // due date for new tasks (not saved)
let newId=null;

/* ---------- dates ---------- */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function fmtDue(s){
  if(s===today())return'Today'; if(s===plus(1))return'Tomorrow'; if(s===plus(-1))return'Yesterday';
  const d=parse(s),o={weekday:'short',month:'short',day:'numeric'};
  if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';
  return d.toLocaleDateString(undefined,o);
}

/* ---------- repeating tasks ---------- */
const isRec=t=>Array.isArray(t.r);
const dueToday=t=>isRec(t)&&t.r.includes(new Date().getDay());
const isDone=t=>isRec(t)?(t.hist||[]).includes(today()):!!t.done;
const DAYS=['Su','Mo','Tu','We','Th','Fr','Sa'];
function repLabel(r){
  const k=r.slice().sort().join();
  if(r.length===7)return'Every day'; if(k==='1,2,3,4,5')return'Weekdays'; if(k==='0,6')return'Weekends';
  return r.slice().sort().map(d=>DAYS[d]).join(' ');
}
function streak(t){
  const h=new Set(t.hist||[]), d=new Date(); let n=0;
  if(!h.has(ymd(d)))d.setDate(d.getDate()-1);
  for(let i=0;i<730;i++){
    if(t.r.includes(d.getDay())){if(h.has(ymd(d)))n++;else break}
    d.setDate(d.getDate()-1);
  }
  return n;
}
const REP='<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>';

/* ---------- render ---------- */
function rowHTML(t,off){
  const c=CAT[t.c]||CAT.personal, td=today(), done=!off&&isDone(t);
  let meta=`<span class="tag">${c.n}</span>`;
  if(isRec(t)){
    meta+=`<span class="rep">${REP}${repLabel(t.r)}</span>`;
    const s=streak(t); if(s>=2)meta+=`<span class="streak">🔥 ${s}</span>`;
  }else if(t.d){
    const cls=!done&&t.d<td?'late':(!done&&t.d===td?'today':'');
    meta+=`<span class="due ${cls}">${CAL}${fmtDue(t.d)}</span>`;
  }
  return `<div class="row${done?' is-done':''}${off?' off':''}${t.id===newId?' new':''}" data-id="${t.id}">
    <div class="under"><span class="u-l">${CHK}${done?'Undo':'Done'}</span><span class="u-r">Delete${TRASH}</span></div>
    <div class="item" style="--c:${c.c}"><span class="chk">${CHK}</span>
      <div class="body"><span class="txt">${esc(t.t)}</span><div class="meta">${meta}</div></div>
    </div></div>`;
}
function group(title,arr,cls='',extra='',cnt=null,off=false){
  if(!arr.length)return'';
  return `<div class="grp"><div class="gh ${cls}">${title}<span class="cnt">${cnt??arr.length}</span>${extra}</div>${arr.map(t=>rowHTML(t,off)).join('')}</div>`;
}
let pendingRender=false;
function render(){
  if(gest&&gest.mode==='swipe'){pendingRender=true;return}
  pendingRender=false;
  const td=today(), f=S.filter;
  const all=S.tasks.filter(t=>f==='all'||t.c===f);
  const rec=all.filter(isRec).sort((a,b)=>a.at-b.at);
  const recToday=rec.filter(dueToday), recOther=rec.filter(t=>!dueToday(t));
  const plain=all.filter(t=>!isRec(t));
  const key=t=>t.d||'9999-99-99';
  const open=plain.filter(t=>!t.done).sort((a,b)=>key(a)<key(b)?-1:key(a)>key(b)?1:a.at-b.at);
  const done=plain.filter(t=>t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const recDone=recToday.filter(isDone).length;
  let h='';
  if(!all.length){
    const nm=f==='all'?'':` in ${CAT[f].n}`;
    h=`<div class="empty"><div class="orb"></div><div class="big">Nothing here${nm}</div>Type below and hit + to add your first task.</div>`;
  }else{
    h+=group(`${REP} Daily`,recToday,'daily','',`${recDone}/${recToday.length}`);
    h+=group('Overdue',open.filter(t=>t.d&&t.d<td),'hot');
    h+=group('Today',open.filter(t=>t.d===td));
    h+=group('Upcoming',open.filter(t=>t.d&&t.d>td));
    h+=group(open.some(t=>t.d)?'Anytime':'To do',open.filter(t=>!t.d));
    if(!open.length&&recDone===recToday.length&&(plain.length||recToday.length))
      h+=`<div class="empty" style="padding-top:30px"><div class="big">All clear ✨</div>Everything${f==='all'?'':' in '+CAT[f].n} is done for today.</div>`;
    h+=group('Done',done,'',`<button class="clear" id="clear">Clear</button>`);
    h+=group('Repeats · not today',recOther,'','',null,true);
  }
  $('list').innerHTML=h;
  newId=null;
  const c=$('clear'); if(c)c.onclick=clearDone;
  renderHeader(plain.length+recToday.length,done.length+recDone,open.length+recToday.length-recDone);
  renderFilters();
}
function renderHeader(total,doneN,left){
  const pct=total?Math.round(doneN/total*100):0;
  $('ringv').style.strokeDashoffset=157.08*(1-pct/100);
  $('pct').textContent=pct+'%';
  const td=today(), doneToday=S.tasks.filter(t=>isRec(t)?(t.hist||[]).includes(td):(t.done&&t.doneAt&&ymd(new Date(t.doneAt))===td)).length;
  $('sub').innerHTML=total?`<b>${left}</b> left · <b>${doneToday}</b> done today`:'Let’s get things done';
}
function renderFilters(){
  const cnt=k=>S.tasks.filter(t=>(k==='all'||t.c===k)&&(isRec(t)?dueToday(t)&&!isDone(t):!t.done)).length;
  let h=`<button class="chip${S.filter==='all'?' on':''}" data-f="all" style="--c:#e5e5ea">All <span class="n">${cnt('all')}</span></button>`;
  h+=CATS.map(c=>`<button class="chip${S.filter===c.k?' on':''}" data-f="${c.k}" style="--c:${c.c}"><span class="dot"></span>${c.n} <span class="n">${cnt(c.k)}</span></button>`).join('');
  $('filters').innerHTML=h;
}
let addRep=null;   // repeat days for new tasks (not saved)
function renderOpts(){
  const cat=CAT[S.cat];
  $('todoApp').style.setProperty('--c',cat.c);
  let h=CATS.map(c=>`<button type="button" class="opt${S.cat===c.k?' on':''}" data-cat="${c.k}" style="--c:${c.c}"><span class="dot"></span>${c.n}</button>`).join('');
  h+='<span class="sep"></span>';
  h+=`<button type="button" class="opt rp${addRep?' on':''}" data-rep="1">${REP} Daily</button>`;
  const isPick=addDue&&addDue!==today()&&addDue!==plus(1);
  h+=`<button type="button" class="opt dt${!addDue&&!addRep?' on':''}" data-due="">No date</button>`;
  h+=`<button type="button" class="opt dt${addDue===today()?' on':''}" data-due="${today()}">Today</button>`;
  h+=`<button type="button" class="opt dt${addDue===plus(1)?' on':''}" data-due="${plus(1)}">Tomorrow</button>`;
  h+=`<label class="opt dt${isPick?' on':''}">${CAL} ${isPick?fmtDue(addDue):'Pick date'}<input type="date" id="pick" value="${addDue||''}"></label>`;
  $('opts').innerHTML=h;
  $('pick').onchange=e=>{addDue=e.target.value||null;if(addDue)addRep=null;renderOpts()};
  $('inp').placeholder=addRep?'Add a daily task…':'Add a task…';
}

/* ---------- actions ---------- */
function addTask(){
  const v=$('inp').value.trim(); if(!v)return;
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const t=addRep?{id,t:v,c:S.cat,r:addRep.slice(),hist:[],at:Date.now()}
                :{id,t:v,c:S.cat,d:addDue,done:false,at:Date.now()};
  S.tasks.push(t);
  if(S.filter!=='all'&&S.filter!==S.cat)S.filter='all';
  newId=t.id; save(); render();
  $('inp').value='';
  requestAnimationFrame(()=>{const r=document.querySelector(`.row[data-id="${t.id}"]`);if(r)r.scrollIntoView({block:'nearest',behavior:'smooth'})});
}
let rTimer=null;
function toggle(id){
  const t=S.tasks.find(x=>x.id===id); if(!t)return;
  let now;
  if(isRec(t)){
    const td=today(), was=isDone(t);
    t.hist=(t.hist||[]).filter(d=>d!==td);
    if(!was)t.hist.push(td);
    now=!was;
    if(t.hist.length>400)t.hist=t.hist.slice(-400);
  }else{t.done=!t.done;t.doneAt=t.done?Date.now():null;now=t.done}
  save();
  const row=document.querySelector(`.row[data-id="${id}"]`);
  if(row){row.classList.toggle('is-done',now);const ul=row.querySelector('.u-l');if(ul)ul.innerHTML=CHK+(now?'Undo':'Done')}
  if(navigator.vibrate)navigator.vibrate(12);
  clearTimeout(rTimer); rTimer=setTimeout(render,750);   // let the strike-through play, then re-sort
}
function removeTask(id,row){
  const i=S.tasks.findIndex(x=>x.id===id); if(i<0)return;
  const t=S.tasks[i];
  const finish=()=>{S.tasks.splice(S.tasks.indexOf(t),1);save();render();toast(isRec(t)?'Repeating task deleted':'Task deleted',()=>{S.tasks.splice(Math.min(i,S.tasks.length),0,t);save();render()})};
  if(row){row.style.height=row.offsetHeight+'px';row.offsetHeight;row.style.height='0px';row.style.marginBottom='0px';row.style.opacity='0';setTimeout(finish,250)}
  else finish();
}
function clearDone(){
  const gone=t=>!isRec(t)&&t.done&&(S.filter==='all'||t.c===S.filter);
  const n=S.tasks.filter(gone).length; if(!n)return;
  const before=S.tasks.slice();
  S.tasks=S.tasks.filter(t=>!gone(t)); save(); render();
  toast(`Cleared ${n} done`,()=>{S.tasks=before;save();render()});
}
// background drifts gently toward your finger / cursor
(()=>{const bg=$('bg');let raf=0;
  addEventListener('pointermove',e=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;
    bg.style.setProperty('--px',((e.clientX/innerWidth-.5)*50).toFixed(1)+'px');
    bg.style.setProperty('--py',((e.clientY/innerHeight-.5)*50).toFixed(1)+'px')})},{passive:true});
  addEventListener('pointerdown',e=>{bg.style.setProperty('--px',((e.clientX/innerWidth-.5)*50).toFixed(1)+'px');bg.style.setProperty('--py',((e.clientY/innerHeight-.5)*50).toFixed(1)+'px')},{passive:true});
})();
let tT=null,tUndo=null;
function toast(msg,undo){
  $('tmsg').textContent=msg; tUndo=undo; $('toast').classList.add('show');
  clearTimeout(tT); tT=setTimeout(()=>{$('toast').classList.remove('show');tUndo=null},4500);
}
$('tundo').onclick=()=>{if(tUndo)tUndo();tUndo=null;$('toast').classList.remove('show')};

/* ---------- gestures: tap = done, swipe right = done, swipe left = delete, hold = edit ---------- */
let gest=null;
const list=$('list');
list.addEventListener('pointerdown',e=>{
  const item=e.target.closest('.item'); if(!item||(e.pointerType==='mouse'&&e.button!==0))return;
  const row=item.parentElement;
  gest={item,row,id:row.dataset.id,x:e.clientX,y:e.clientY,dx:0,mode:null,pid:e.pointerId,
    th:Math.min(110,row.offsetWidth*.28),
    hold:setTimeout(()=>{if(gest&&!gest.mode){gest.mode='hold';openEdit(gest.id)}},520)};
});
list.addEventListener('pointermove',e=>{
  const g=gest; if(!g||e.pointerId!==g.pid)return;
  const dx=e.clientX-g.x, dy=e.clientY-g.y;
  if(!g.mode){
    if(Math.abs(dx)>9&&Math.abs(dx)>Math.abs(dy)*1.3){
      g.mode='swipe';clearTimeout(g.hold);
      try{g.item.setPointerCapture(g.pid)}catch(_){}
      g.item.style.transition='none';g.row.classList.add('swiping');
    }else if(Math.abs(dy)>9||Math.abs(dx)>9){g.mode='scroll';clearTimeout(g.hold)}
  }
  if(g.mode==='swipe'){
    e.preventDefault();
    const r=dx>g.th*1.6?g.th*1.6+(dx-g.th*1.6)*.35:dx;      // a little resistance past the trigger point
    g.dx=dx; g.item.style.transform=`translateX(${r}px)`;
    g.row.classList.toggle('go-r',dx>0); g.row.classList.toggle('go-l',dx<0);
    const armed=Math.abs(dx)>g.th;
    if(armed!==g.armed&&armed&&navigator.vibrate)navigator.vibrate(8);
    g.armed=armed; g.row.classList.toggle('armed',armed);
  }
},{passive:false});
function endGesture(e,cancel){
  const g=gest; if(!g||e.pointerId!==g.pid)return;
  clearTimeout(g.hold); gest=null;
  if(g.mode==='swipe'){
    g.item.style.transition='';
    if(!cancel&&g.dx>g.th){g.item.style.transform='';if(!g.row.classList.contains('off'))toggle(g.id)}
    else if(!cancel&&g.dx<-g.th){g.item.style.transform='translateX(-110%)';removeTask(g.id,g.row)}
    else g.item.style.transform='';
    setTimeout(()=>{g.row.classList.remove('swiping','go-r','go-l','armed')},300);
    if(pendingRender)setTimeout(render,320);
  }else if(!g.mode&&!cancel){if(g.row.classList.contains('off'))openEdit(g.id);else toggle(g.id)}
}
list.addEventListener('pointerup',e=>endGesture(e,false));
list.addEventListener('pointercancel',e=>endGesture(e,true));
list.addEventListener('contextmenu',e=>{if(e.target.closest('.item'))e.preventDefault()});

/* ---------- add dock ---------- */
$('form').addEventListener('submit',e=>{e.preventDefault();addTask();$('inp').focus()});
$('opts').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.cat){S.cat=b.dataset.cat;save()}
  if('due' in b.dataset){addDue=b.dataset.due||null;addRep=null}
  if(b.dataset.rep){addRep=addRep?null:[0,1,2,3,4,5,6];addDue=null}
  renderOpts();
});
$('filters').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b)return;
  S.filter=b.dataset.f; if(S.filter!=='all')S.cat=S.filter;
  save(); render(); renderOpts();
});
// keep the add bar above the iPhone keyboard
if(window.visualViewport){
  const vv=visualViewport, dock=$('dock');
  const fit=()=>{const off=window.innerHeight-vv.height-vv.offsetTop;dock.style.transform=off>1?`translateY(${-off}px)`:''};
  vv.addEventListener('resize',fit); vv.addEventListener('scroll',fit);
}

/* ---------- edit sheet ---------- */
let editing=null,eCat=null,eDue=null,eRep=null;
function openEdit(id){
  const t=S.tasks.find(x=>x.id===id); if(!t)return;
  if(navigator.vibrate)navigator.vibrate(15);
  editing=t; eCat=t.c; eDue=t.d||null; eRep=isRec(t)?t.r.slice():null;
  $('etxt').value=t.t; drawEdit();
  $('tscrim').classList.add('open');
}
function drawEdit(){
  $('sheet').style.setProperty('--c',CAT[eCat].c);
  $('ecats').innerHTML=CATS.map(c=>`<button class="opt${eCat===c.k?' on':''}" data-cat="${c.k}" style="--c:${c.c}"><span class="dot"></span>${c.n}</button>`).join('');
  const isPick=eDue&&eDue!==today()&&eDue!==plus(1);
  $('edue').innerHTML=`<button class="opt dt${!eDue?' on':''}" data-due="">No date</button><button class="opt dt${eDue===today()?' on':''}" data-due="${today()}">Today</button><button class="opt dt${eDue===plus(1)?' on':''}" data-due="${plus(1)}">Tomorrow</button><label class="opt dt${isPick?' on':''}">${CAL} ${isPick?fmtDue(eDue):'Pick date'}<input type="date" id="epick" value="${eDue||''}"></label>`;
  $('epick').onchange=e=>{eDue=e.target.value||null;drawEdit()};
  const k=eRep?eRep.slice().sort().join():'';
  $('erep').innerHTML=[['off','Off',!eRep],['all','Every day',k==='0,1,2,3,4,5,6'],['wk','Weekdays',k==='1,2,3,4,5']]
    .map(([v,n,on])=>`<button class="opt rp${on?' on':''}" data-r="${v}">${v==='off'?'':REP+' '}${n}</button>`).join('');
  $('edays').innerHTML=eRep?DAYS.map((d,i)=>`<button class="opt day${eRep.includes(i)?' on':''}" data-d="${i}">${d}</button>`).join(''):'';
  $('eduebox').hidden=!!eRep;
}
$('erep').onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.r;
  eRep=v==='off'?null:v==='all'?[0,1,2,3,4,5,6]:[1,2,3,4,5];drawEdit()};
$('edays').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=+b.dataset.d;
  eRep=eRep.includes(d)?eRep.filter(x=>x!==d):[...eRep,d].sort();if(!eRep.length)eRep=null;drawEdit()};
$('ecats').onclick=e=>{const b=e.target.closest('button');if(b){eCat=b.dataset.cat;drawEdit()}};
$('edue').onclick=e=>{const b=e.target.closest('button');if(b){eDue=b.dataset.due||null;drawEdit()}};
function closeEdit(){$('tscrim').classList.remove('open');editing=null}
$('tscrim').addEventListener('click',e=>{if(e.target===$('tscrim'))closeEdit()});
$('esave').onclick=()=>{
  if(!editing)return; const v=$('etxt').value.trim();
  if(v){
    const t=editing; t.t=v; t.c=eCat;
    if(eRep){t.r=eRep.slice();t.hist=t.hist||[];if(t.done&&!t.hist.includes(today()))t.hist.push(today());delete t.d;delete t.done;delete t.doneAt}
    else{if(isRec(t)){t.done=t.hist.includes(today());t.doneAt=t.done?Date.now():null;delete t.r;delete t.hist}t.d=eDue}
    save();render()}
  closeEdit();
};
$('edel').onclick=()=>{if(!editing)return;const id=editing.id;closeEdit();removeTask(id,null)};

/* ---------- boot ---------- */
$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
render(); renderOpts();
// refresh "Today/Overdue" when the app comes back the next day
let lastDay=today();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&today()!==lastDay){lastDay=today();$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});render();renderOpts()}});

/* ---------- import from the old standalone app ---------- */
$('impBtn').onclick=async()=>{
  let raw='';try{raw=await navigator.clipboard.readText()}catch(e){}
  if(!raw||raw.indexOf('"tasks"')<0)raw=prompt('In the old To-Do app, tap "Copy my tasks", then paste here:')||'';
  let got;try{got=JSON.parse(raw)}catch(e){toast('That didn\u2019t look like copied tasks');return}
  const have=new Set(S.tasks.map(t=>t.id)),add=(got.tasks||[]).filter(t=>t&&t.id&&!have.has(t.id));
  if(!add.length){toast('No new tasks to bring over');return}
  S.tasks.push(...add);save();render();toast('Brought over '+add.length+(add.length===1?' task':' tasks'),()=>{const ids=new Set(add.map(t=>t.id));S.tasks=S.tasks.filter(t=>!ids.has(t.id));save();render()});
};

})();
</script>
<script>
/* ===== Money ===== */
(()=>{
const KEY='colby.money.v1',$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=[['gas','Gas','#3987e5'],['groceries','Groceries','#d95926'],['eating','Eating out','#199e70'],['tuition','Tuition','#c98500'],['shopping','Shopping','#d55181'],['subs','Subscriptions','#008300'],['fun','Fun','#9085e9'],['other','Other','#e66767']];
const CAT=Object.fromEntries(CATS.map(c=>[c[0],{n:c[1],c:c[2]}]));
const FIXED=new Set(['tuition','subs']);
const DEF={plan:{wage:0,hours:48,per:'bi',tax:0,price:0,mpg:23.5,wk:290,mo:720,b:{groceries:0,eating:0,tuition:150,shopping:0,subs:0,fun:0,other:0}},tx:[],lastSent:null};
let S=JSON.parse(JSON.stringify(DEF));
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.plan){S={...S,...s,plan:{...S.plan,...s.plan,b:{...S.plan.b,...(s.plan.b||{})}}};if(!Array.isArray(S.tx))S.tx=[]}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const NOW=()=>new Date();
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const M=(n,c)=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:c?2:0,maximumFractionDigits:c?2:0});
const sum=a=>a.reduce((s,t)=>s+(+t.a||0),0);
const PER={wk:52/12,bi:26/12,semi:2,mo:1};
let cur={y:NOW().getFullYear(),m:NOW().getMonth()},focus=null;

const gasMiles=()=>S.plan.wk*52/12+S.plan.mo;
const gasBudget=()=>S.plan.price>0&&S.plan.mpg>0?gasMiles()/S.plan.mpg*S.plan.price:0;
const budget=c=>c==='gas'?gasBudget():(+S.plan.b[c]||0);
const planIncome=()=>S.plan.wage*S.plan.hours*PER[S.plan.per]*(1-S.plan.tax/100);
const planSpend=()=>CATS.reduce((s,c)=>s+budget(c[0]),0);

function calc(){
  const mk=cur.y+'-'+String(cur.m+1).padStart(2,'0'),n=NOW();
  const tx=S.tx.filter(t=>t.d&&t.d.startsWith(mk)).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);
  const exp=tx.filter(t=>t.t!=='inc'),inc=tx.filter(t=>t.t==='inc'),by={};
  exp.forEach(t=>by[t.c]=(by[t.c]||0)+(+t.a||0));
  const days=new Date(cur.y,cur.m+1,0).getDate(),isCur=n.getFullYear()===cur.y&&n.getMonth()===cur.m;
  const past=new Date(cur.y,cur.m+1,1)<=n,day=isCur?n.getDate():past?days:0;
  const spent=sum(exp),income=sum(inc);
  let proj=spent;
  if(isCur)proj=CATS.reduce((s,[k])=>{const a=by[k]||0;return s+(FIXED.has(k)?Math.max(a,budget(k)):a/day*days)},0);
  const pInc=planIncome(),pSp=planSpend(),expInc=isCur?Math.max(income,pInc):income;
  return{mk,tx,by,days,day,isCur,past,spent,income,proj,pInc,pSp,projSave:expInc-proj,planSave:pInc-pSp};
}
function donut(d){
  const parts=CATS.filter(([k])=>d.by[k]>0).map(([k])=>({k,v:d.by[k]}));
  if(!parts.length)return'';
  const R=42,C=2*Math.PI*R,gap=parts.length>1?2.5:0;let off=0,segs='';
  parts.forEach(p=>{const len=p.v/d.spent*C;
    segs+=`<circle class="${focus===p.k?'on':''}" data-foc="${p.k}" cx="60" cy="60" r="${R}" stroke="${CAT[p.k].c}" stroke-dasharray="${Math.max(.5,len-gap)} ${C}" stroke-dashoffset="${-off}"><title>${CAT[p.k].n}: ${M(p.v,1)}</title></circle>`;off+=len});
  const f=focus&&d.by[focus]?focus:null;
  return `<div class="card"><p class="lbl">Where it went</p><div class="donut"><div class="dwrap ${f?'foc':''}"><svg viewBox="0 0 120 120" role="img" aria-label="Spending by category">${segs}</svg>
    <div class="dmid"><div><b>${M(f?d.by[f]:d.spent)}</b><br><span>${f?CAT[f].n+' · '+Math.round(d.by[f]/d.spent*100)+'%':'spent'}</span></div></div></div>
    <div class="leg">${parts.map(p=>`<button data-foc="${p.k}" class="${f===p.k?'on':''}" style="--c:${CAT[p.k].c}"><i></i><span>${CAT[p.k].n}</span><em>${Math.round(p.v/d.spent*100)}%</em></button>`).join('')}</div></div></div>`;
}
function render(anim){
  const d=calc(),n=NOW();
  $('mMonth').textContent=new Date(cur.y,cur.m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const hasPlan=d.pInc>0||CATS.some(([k])=>k!=='tuition'&&budget(k)>0);
  let h='';
  const due=!S.lastSent||(Date.now()-S.lastSent)>6.5*864e5;
  if(due&&hasPlan&&d.isCur)h+=`<div class="card nudge"><span class="dotp"></span><p><b>Weekly check-in</b>Send this week's numbers to Claude to compare against your plan.</p></div>`;
  if(!hasPlan)h+=`<div class="card hero"><p class="lbl">Start here</p><div class="big" style="font-size:30px">Set up your plan</div><p class="hsub">Add your hourly pay, the Costco gas price and a monthly budget for each category. Everything below compares what you actually spend against it.</p><div class="acts" style="grid-template-columns:1fr"><button class="abtn pri" data-act="plan">Set up plan</button></div></div>`;
  else{
    const left=d.pSp-d.spent,pct=d.pSp?Math.min(100,d.spent/d.pSp*100):0,should=d.pSp*d.day/d.days,ahead=d.spent-should;
    h+=`<div class="card hero"><p class="lbl">${left>=0?'Left to spend':'Over budget'}${d.isCur?' this month':''}</p><div class="big ${left<0?'neg':''}" data-n="${Math.abs(left)}">${M(Math.abs(left))}</div>
      <div class="hsub">Spent <b style="color:var(--fg)">${M(d.spent)}</b> of ${M(d.pSp)} planned</div>
      <div class="track ${left<0?'over':''}"><i style="width:${anim?0:pct}%" data-w="${pct}"></i>${d.isCur?`<u style="left:${d.day/d.days*100}%" title="Today"></u>`:''}</div>
      <div class="pace">${d.isCur?`<span>Day ${d.day} of ${d.days} · white line is today</span><span class="pill ${ahead>should*.05+1?'bad':''}">${ahead>should*.05+1?M(ahead)+' ahead of pace':'On pace'}</span>`:`<span>${d.past?'Month finished':'Not started yet'}</span>`}</div></div>`;
    h+=`<div class="tiles"><div class="tile"><p class="lbl">Income</p><b data-n="${d.income}">${M(d.income)}</b><small>plan ${M(d.pInc)}</small></div>
      <div class="tile"><p class="lbl">${d.isCur?'Projected spend':'Spent'}</p><b data-n="${d.proj}" style="${d.proj>d.pSp+1?'color:var(--hot)':''}">${M(d.proj)}</b><small>plan ${M(d.pSp)}</small></div>
      <div class="tile"><p class="lbl">${d.isCur?'Projected saved':'Saved'}</p><b data-n="${Math.abs(d.projSave)}" style="${d.projSave<0?'color:var(--hot)':''}">${M(d.projSave)}</b><small>plan ${M(d.planSave)}</small></div></div>`;
  }
  h+=donut(d);
  const rows=CATS.filter(([k])=>budget(k)>0||d.by[k]>0);
  if(rows.length&&hasPlan)h+=`<div class="card"><p class="lbl">Plan vs. actual</p><div class="cmp">${rows.map(([k])=>{const a=d.by[k]||0,b=budget(k),w=b?Math.min(100,a/b*100):100;
    return `<div class="cr ${a>b+.005?'over':''}" style="--c:${CAT[k].c}"><div class="t"><span><i></i>${CAT[k].n}</span><em><b>${M(a)}</b> / ${b?M(b):'no budget'}</em></div><div class="cbar"><i style="width:${anim?0:w}%" data-w="${w}"></i></div></div>`}).join('')}</div></div>`;
  h+=`<div class="card"><p class="lbl">Entries${d.tx.length?' · '+d.tx.length:''}</p>${d.tx.length?d.tx.map(t=>{const inc=t.t==='inc',c=inc?'#34d399':(CAT[t.c]||CAT.other).c,nm=inc?'Paycheck':(CAT[t.c]||CAT.other).n;
    return `<button class="tx" data-tx="${esc(t.id)}" style="--c:${c}"><i></i><span><b>${esc(t.n||nm)}</b><small>${t.n?nm+' · ':''}${new Date(t.d+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</small></span><em class="${inc?'in':''}">${inc?'+':''}${M(+t.a,1)}</em></button>`}).join(''):'<div class="empty">Nothing logged for this month yet. Tap + Add for a purchase or paycheck.</div>'}</div>`;
  h+=`<div class="acts"><button class="abtn pri" data-act="send">Send to Claude</button><button class="abtn" data-act="paste">Paste update from Claude</button></div>`;
  const b=$('mBody');b.innerHTML=h;b.classList.toggle('rise',!!anim);
  if(anim){[...b.children].forEach((c,i)=>c.style.setProperty('--i',i));
    requestAnimationFrame(()=>requestAnimationFrame(()=>b.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%')));
    if(!matchMedia('(prefers-reduced-motion:reduce)').matches)b.querySelectorAll('[data-n]').forEach(e=>{const to=+e.dataset.n,fin=e.textContent,neg=fin.startsWith('−'),t0=performance.now();
      const step=t=>{const p=Math.min(1,(t-t0)/700),v=to*(1-Math.pow(1-p,3));e.textContent=p<1?(neg?'−':'')+M(v):fin;if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
  }
}
let tT;function toast(m){$('mToast').textContent=m;$('mToast').classList.add('show');clearTimeout(tT);tT=setTimeout(()=>$('mToast').classList.remove('show'),3800)}
const open=h=>{$('mSheet').innerHTML='<div class="grab"></div>'+h;$('mSheet').scrollTop=0;$('mScrim').classList.add('open')};
const close=()=>$('mScrim').classList.remove('open');
$('mScrim').addEventListener('click',e=>{if(e.target===$('mScrim'))close()});

/* ----- add / edit an entry ----- */
function txSheet(id){
  const old=S.tx.find(t=>t.id===id);let type=old?old.t||'exp':'exp',cat=old?old.c:'gas';
  const draw=()=>{
    $('eType').innerHTML=[['exp','Purchase'],['inc','Paycheck']].map(([k,n])=>`<button class="opt ${type===k?'on':''}" data-type="${k}">${n}</button>`).join('');
    $('eCats').innerHTML=CATS.map(([k,n,c])=>`<button class="opt ${cat===k?'on':''}" data-cat="${k}" style="--c:${c}"><i></i>${n}</button>`).join('');
    $('eCatBox').hidden=type==='inc';
  };
  open(`<h2>${old?'Edit entry':'Add entry'}</h2><div class="wrap" id="eType" style="margin:10px 0 12px"></div>
    <input class="amt" id="eAmt" inputmode="decimal" placeholder="$0.00" value="${old?(+old.a).toFixed(2):''}" aria-label="Amount">
    <div id="eCatBox"><p class="lbl">Category</p><div class="wrap" id="eCats"></div></div>
    <div class="two" style="margin-top:16px"><label>Date<input id="eDate" type="date" value="${old?old.d:ymd(NOW())}"></label><label>Note (optional)<input id="eNote" maxlength="60" value="${old?esc(old.n||''):''}"></label></div>
    <div class="sacts">${old?'<button class="btn del" id="eDel">Delete</button>':''}<button class="btn save" id="eSave">Save</button></div>`);
  draw();
  $('eType').onclick=e=>{const b=e.target.closest('[data-type]');if(b){type=b.dataset.type;draw()}};
  $('eCats').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){cat=b.dataset.cat;draw()}};
  $('eSave').onclick=()=>{const a=parseFloat($('eAmt').value.replace(/[^0-9.]/g,''));if(!(a>0)){$('eAmt').focus();return}
    const t={id:old?old.id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:type,a:Math.round(a*100)/100,c:type==='inc'?'income':cat,d:$('eDate').value||ymd(NOW()),n:$('eNote').value.trim()};
    if(old)S.tx[S.tx.indexOf(old)]=t;else S.tx.push(t);
    const dt=new Date(t.d+'T12:00');cur={y:dt.getFullYear(),m:dt.getMonth()};save();close();render(false);toast(old?'Saved':'Added '+M(t.a,1))};
  if(old)$('eDel').onclick=()=>{S.tx=S.tx.filter(t=>t.id!==id);save();close();render(false);toast('Entry deleted')};
  if(!old)setTimeout(()=>$('eAmt').focus(),320);
}
/* ----- plan ----- */
function planSheet(){
  const p=S.plan;let per=p.per;
  const num=(id,l,v,ph='0')=>`<label>${l}<input id="${id}" inputmode="decimal" placeholder="${ph}" value="${v||''}"></label>`;
  open(`<h2>Your plan</h2><p class="s">This is the "expected" side. Your entries are compared against it.</p>
    <p class="lbl">Income</p><div class="two">${num('pWage','Hourly pay ($)',p.wage)}${num('pHours','Hours per paycheck',p.hours)}</div>
    <div class="wrap" id="pPer" style="margin-top:10px"></div>
    <div class="one" style="margin-top:10px">${num('pTax','Taken out for taxes (%)',p.tax)}</div><div class="calc" id="pIncCalc"></div>
    <p class="lbl">Gas</p><div class="two">${num('pPrice','Costco price ($/gal)',p.price,'e.g. 3.59')}${num('pMpg','Car mpg',p.mpg)}</div>
    <div class="two" style="margin-top:10px">${num('pWk','Miles every week',p.wk)}${num('pMo','Extra miles a month',p.mo)}</div><div class="calc" id="pGasCalc"></div>
    <p class="lbl">Monthly budget</p><div class="two">${CATS.filter(c=>c[0]!=='gas').map(([k,n])=>num('pb_'+k,n+' ($)',p.b[k])).join('')}</div>
    <div class="sacts"><button class="btn save" id="pSave">Save plan</button></div>`);
  const v=id=>parseFloat($(id).value)||0;
  const upd=()=>{$('pPer').innerHTML=[['wk','Weekly'],['bi','Every 2 weeks'],['semi','Twice a month'],['mo','Monthly']].map(([k,n])=>`<button class="opt ${per===k?'on':''}" data-per="${k}">${n}</button>`).join('');
    $('pIncCalc').textContent='≈ '+M(v('pWage')*v('pHours')*PER[per]*(1-v('pTax')/100))+' take-home a month';
    const mi=v('pWk')*52/12+v('pMo');$('pGasCalc').textContent=v('pPrice')&&v('pMpg')?`≈ ${Math.round(mi).toLocaleString()} miles → ${M(mi/v('pMpg')*v('pPrice'))} of gas a month`:`≈ ${Math.round(mi).toLocaleString()} miles a month. Add the gas price to get a dollar amount.`};
  upd();$('mSheet').oninput=upd;
  $('pPer').onclick=e=>{const b=e.target.closest('[data-per]');if(b){per=b.dataset.per;upd()}};
  $('pSave').onclick=()=>{Object.assign(p,{wage:v('pWage'),hours:v('pHours'),per,tax:Math.min(90,v('pTax')),price:v('pPrice'),mpg:v('pMpg')||23.5,wk:v('pWk'),mo:v('pMo')});
    CATS.forEach(([k])=>{if(k!=='gas')p.b[k]=v('pb_'+k)});save();close();render(true);toast('Plan saved')};
}
/* ----- send to / receive from Claude ----- */
function summary(){
  const d=calc(),L=[];
  L.push(`PLANNER MONEY UPDATE · ${new Date(cur.y,cur.m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}${d.isCur?` (day ${d.day} of ${d.days})`:''}`,'');
  L.push('PLAN (monthly)',`Take-home income: ${M(d.pInc)}  [${M(S.plan.wage,1)}/hr × ${S.plan.hours} h, ${S.plan.per}, ${S.plan.tax}% tax]`);
  CATS.forEach(([k,n])=>L.push(`${n}: ${M(budget(k))}`));
  L.push(`Total budget: ${M(d.pSp)} · planned savings: ${M(d.planSave)}`,`Gas inputs: ${M(S.plan.price,1)}/gal, ${S.plan.mpg} mpg, ${Math.round(gasMiles())} mi/month`,'');
  L.push('ACTUAL SO FAR',`Income: ${M(d.income,1)} · Spent: ${M(d.spent,1)}`);
  CATS.forEach(([k,n])=>{if(d.by[k])L.push(`${n}: ${M(d.by[k],1)} of ${M(budget(k))}`)});
  if(d.isCur)L.push(`Projected month-end spend: ${M(d.proj)} · projected savings: ${M(d.projSave)}`);
  L.push('','ENTRIES');
  d.tx.slice().reverse().forEach(t=>L.push(`${t.d}  ${t.t==='inc'?'PAYCHECK':(CAT[t.c]||CAT.other).n}  ${M(+t.a,1)}${t.n?'  '+t.n:''}`));
  if(!d.tx.length)L.push('(none logged)');
  L.push('','Please compare my actual spending to my plan, tell me where I am off, and give me a "Paste update from Claude" code if anything should change.');
  return L.join('\n');
}
async function send(){
  const text=summary();let ok=false;
  if(navigator.share){try{await navigator.share({text});ok=true}catch(e){if(e&&e.name==='AbortError')return}}
  if(!ok){try{await navigator.clipboard.writeText(text);ok=true;toast('Copied. Paste it into your chat with Claude')}catch(e){prompt('Copy this and paste it into your chat with Claude:',text);ok=true}}
  S.lastSent=Date.now();save();render(false);
}
async function paste(){
  let raw='';try{raw=await navigator.clipboard.readText()}catch(e){}
  if(!raw||raw.indexOf('{')<0)raw=prompt('Paste the update code Claude gave you:')||'';
  if(!raw.trim())return;
  let g;try{g=JSON.parse(raw.slice(raw.indexOf('{'),raw.lastIndexOf('}')+1))}catch(e){toast('That didn’t look like an update code');return}
  let added=0;const have=new Set(S.tx.map(t=>t.id));
  (Array.isArray(g.tx)?g.tx:[]).forEach(t=>{if(!t||!(+t.a>0)||!/^\d{4}-\d{2}-\d{2}$/.test(t.d||''))return;
    const inc=t.t==='inc',c=inc?'income':CAT[t.c]?t.c:'other',n=String(t.n||'').slice(0,60),id=String(t.id||'i'+t.d+(+t.a)+c+n);
    if(have.has(id))return;have.add(id);S.tx.push({id,t:inc?'inc':'exp',a:Math.round(+t.a*100)/100,c,d:t.d,n});added++});
  let plan=false;
  if(+g.gasPrice>0){S.plan.price=+g.gasPrice;plan=true}
  if(g.plan&&typeof g.plan==='object'){['wage','hours','tax','price','mpg','wk','mo'].forEach(k=>{if(+g.plan[k]>=0&&g.plan[k]!==''&&g.plan[k]!=null){S.plan[k]=+g.plan[k];plan=true}});
    if(PER[g.plan.per]){S.plan.per=g.plan.per;plan=true}
    if(g.plan.b)CATS.forEach(([k])=>{if(k!=='gas'&&+g.plan.b[k]>=0&&g.plan.b[k]!=null){S.plan.b[k]=+g.plan.b[k];plan=true}})}
  if(!added&&!plan){toast('Nothing new in that update');return}
  save();render(true);toast([added?`Added ${added} ${added===1?'entry':'entries'}`:'',plan?'plan updated':''].filter(Boolean).join(' · '));
}
$('mBody').addEventListener('click',e=>{
  const f=e.target.closest('[data-foc]');if(f){focus=focus===f.dataset.foc?null:f.dataset.foc;render(false);return}
  const t=e.target.closest('[data-tx]');if(t){txSheet(t.dataset.tx);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  ({plan:planSheet,send,paste})[a.dataset.act]();
});
$('mAdd').onclick=()=>txSheet(null);
$('mPlanBtn').onclick=planSheet;
$('mPrev').onclick=()=>{cur=cur.m?{y:cur.y,m:cur.m-1}:{y:cur.y-1,m:11};focus=null;render(true)};
$('mNext').onclick=()=>{cur=cur.m<11?{y:cur.y,m:cur.m+1}:{y:cur.y+1,m:0};focus=null;render(true)};
addEventListener('tab-show',e=>{if(e.detail==='money')render(true)});
render(false);
})();
</script>
<script>
/* ===== Tab bar ===== */
(()=>{
  const KEY='colby.tab',T={cal:'calApp',todo:'todoApp',money:'moneyApp'},scroll={cal:0,todo:0,money:0};
  let cur=null;
  const badge=()=>{
    try{const s=JSON.parse(localStorage.getItem('colby.todo.v1')||'null'),d=new Date(),td=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      const n=(s&&s.tasks||[]).filter(t=>Array.isArray(t.r)?t.r.includes(d.getDay())&&!(t.hist||[]).includes(td):!t.done&&t.d&&t.d<=td).length;
      document.getElementById('todoBadge').textContent=n?String(n):'';}catch(e){}
  };
  function show(t,anim){
    if(!T[t])t='cal';
    if(cur===t)return;
    if(cur)scroll[cur]=window.scrollY;
    cur=t;
    for(const k in T){document.getElementById(T[k]).hidden=k!==t;document.getElementById('tab-'+k).setAttribute('aria-selected',k===t)}
    document.body.className='on-'+t;
    const el=document.getElementById(T[t]);
    if(anim){el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter')}
    window.scrollTo(0,scroll[t]);
    try{localStorage.setItem(KEY,t)}catch(e){}
    badge();dispatchEvent(new CustomEvent('tab-show',{detail:t}));
  }
  for(const k in T)document.getElementById('tab-'+k).onclick=()=>show(k,true);
  const h=location.hash.replace('#','');
  let start=h==='calendar'?'cal':T[h]?h:null;
  if(!start)try{start=localStorage.getItem(KEY)}catch(e){}
  show(start||'cal',false);
  addEventListener('todo-change',badge);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)badge()});
})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
